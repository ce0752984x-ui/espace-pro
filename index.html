<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ENT Collège - Plateforme Enseignants</title>
    <!-- Firebase SDK (pour ceux qui veulent, sinon localStorage) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        /* --- CSS minimal mais complet --- */
        :root {
            --primary: #4361ee;
            --primary-dark: #2a3fa8;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-500: #64748b;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --sidebar-width: 260px;
            --header-height: 64px;
            --border-radius: 12px;
            --box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --transition: all 0.25s ease;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f8fafc;
            color: var(--gray-800);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #loginPage {
            display: none;
            position: fixed;
            inset: 0;
            background: linear-gradient(145deg, #eef2ff, #e0e7ff);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #loginPage.active {
            display: flex;
        }
        .login-card {
            background: #fff;
            padding: 40px 32px;
            border-radius: var(--border-radius);
            box-shadow: 0 25px 60px rgba(67, 97, 238, 0.15);
            width: 100%;
            max-width: 400px;
        }
        .login-card h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            text-align: center;
            margin-bottom: 6px;
        }
        .login-card p {
            text-align: center;
            color: var(--gray-500);
            margin-bottom: 24px;
        }
        .login-card label {
            font-weight: 600;
            display: block;
            font-size: 14px;
            margin-top: 16px;
            margin-bottom: 4px;
            color: var(--gray-700);
        }
        .login-card input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--gray-200);
            border-radius: 10px;
            font-size: 15px;
            background: #fff;
            transition: var(--transition);
        }
        .login-card input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.12);
        }
        .login-card button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 22px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.3);
        }
        .login-card button:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }
        .login-error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
        }
        #sidebar {
            width: var(--sidebar-width);
            background: #fff;
            border-right: 1px solid var(--gray-200);
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            transition: var(--transition);
            overflow-y: auto;
        }
        #sidebar .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px 20px 14px;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            border-bottom: 1px solid var(--gray-200);
        }
        #sidebar .brand i {
            font-size: 26px;
        }
        #sidebar .user-info {
            padding: 16px 20px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            gap: 14px;
        }
        #sidebar .user-info .avatar {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            flex-shrink: 0;
        }
        #sidebar .user-info .name {
            font-weight: 600;
            font-size: 15px;
        }
        #sidebar .user-info .role {
            font-size: 12px;
            color: var(--gray-500);
        }
        #sidebar .menu {
            flex: 1;
            padding: 10px 0 20px;
        }
        #sidebar .menu .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            color: var(--gray-700);
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
            border-left: 3px solid transparent;
            font-weight: 500;
        }
        #sidebar .menu .menu-item:hover {
            background: var(--gray-100);
            color: var(--primary);
        }
        #sidebar .menu .menu-item.active {
            background: rgba(67, 97, 238, 0.08);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 600;
        }
        #sidebar .menu .menu-item i {
            width: 22px;
            text-align: center;
            font-size: 17px;
        }
        #sidebar .logout-btn {
            padding: 16px 20px;
            border-top: 1px solid var(--gray-200);
            color: #e74c3c;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
        }
        #sidebar .logout-btn:hover {
            background: #fef2f2;
        }
        #main {
            margin-left: var(--sidebar-width);
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #header {
            height: var(--header-height);
            background: #fff;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
        }
        #header .left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        #header .left .toggle-sidebar {
            display: none;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--gray-500);
            padding: 4px 8px;
        }
        #header .left .page-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--gray-900);
        }
        #header .right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        #header .right .sync-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--gray-500);
            padding: 4px 12px;
            border-radius: 20px;
            background: var(--gray-100);
        }
        #header .right .notification-bell {
            position: relative;
            cursor: pointer;
            font-size: 20px;
            color: var(--gray-700);
            transition: var(--transition);
        }
        #header .right .notification-bell:hover {
            color: var(--primary);
        }
        #header .right .notification-bell .count {
            position: absolute;
            top: -6px;
            right: -8px;
            background: #e74c3c;
            color: #fff;
            font-size: 11px;
            border-radius: 30px;
            padding: 1px 7px;
            min-width: 20px;
            text-align: center;
            font-weight: 600;
        }
        #header .right .user-menu {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 6px 12px 6px 8px;
            border-radius: 30px;
            transition: var(--transition);
        }
        #header .right .user-menu:hover {
            background: var(--gray-100);
        }
        #header .right .user-menu .avatar-sm {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }
        #header .right .user-menu span {
            font-weight: 500;
            font-size: 14px;
            color: var(--gray-700);
        }
        #content {
            flex: 1;
            padding: 24px 28px;
            overflow-y: auto;
            background: #f8fafc;
        }
        .page-section {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .page-section.active {
            display: block;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .page-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--gray-900);
        }
        .page-subtitle {
            color: var(--gray-500);
            margin-bottom: 24px;
            font-size: 15px;
        }
        .card {
            background: #fff;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 20px 22px;
            margin-bottom: 20px;
            border: 1px solid var(--gray-100);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-weight: 600;
            font-size: 18px;
            color: var(--gray-800);
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        .stat-card {
            background: #fff;
            border-radius: var(--border-radius);
            padding: 18px 20px;
            box-shadow: var(--box-shadow);
            border: 1px solid var(--gray-100);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .stat-card .icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            flex-shrink: 0;
        }
        .stat-card .icon.blue {
            background: var(--primary);
        }
        .stat-card .icon.green {
            background: #4caf50;
        }
        .stat-card .icon.orange {
            background: #f9a825;
        }
        .stat-card .icon.red {
            background: #e74c3c;
        }
        .stat-card .icon.purple {
            background: #8b5cf6;
        }
        .stat-card .info h3 {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.2;
        }
        .stat-card .info span {
            color: var(--gray-500);
            font-size: 14px;
        }
        .btn {
            padding: 8px 18px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
        }
        .btn-success {
            background: #4caf50;
            color: #fff;
        }
        .btn-success:hover {
            background: #388e3c;
        }
        .btn-danger {
            background: #e74c3c;
            color: #fff;
        }
        .btn-danger:hover {
            background: #c62828;
        }
        .btn-warning {
            background: #f9a825;
            color: #212529;
        }
        .btn-warning:hover {
            background: #f57f17;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--gray-300);
            color: var(--gray-700);
        }
        .btn-outline:hover {
            background: var(--gray-100);
        }
        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
            border-radius: 8px;
        }
        .btn-block {
            width: 100%;
            justify-content: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            color: var(--gray-700);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--gray-200);
            border-radius: 10px;
            font-size: 14px;
            background: #fff;
            transition: var(--transition);
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.12);
        }
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        table th {
            text-align: left;
            padding: 12px 10px;
            background: var(--gray-100);
            font-weight: 600;
            color: var(--gray-700);
            border-bottom: 2px solid var(--gray-200);
        }
        table td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--gray-100);
        }
        table tr:hover td {
            background: var(--gray-100);
        }
        .badge-status {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-status.pending {
            background: #fff3cd;
            color: #856404;
        }
        .badge-status.accepted {
            background: #d4edda;
            color: #155724;
        }
        .badge-status.refused {
            background: #f8d7da;
            color: #721c24;
        }
        .badge-status.active {
            background: #d1ecf1;
            color: #0c5460;
        }
        .badge-status.inactive {
            background: #e2e3e5;
            color: #383d41;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 16px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #fff;
            border-radius: var(--border-radius);
            max-width: 680px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.2);
            animation: fadeUp 0.25s ease;
        }
        .modal h2 {
            margin-bottom: 20px;
            font-size: 22px;
        }
        .modal .close-modal {
            float: right;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--gray-500);
            transition: var(--transition);
        }
        .modal .close-modal:hover {
            color: var(--gray-800);
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .calendar-grid .day {
            padding: 8px 4px;
            text-align: center;
            border-radius: 8px;
            background: var(--gray-100);
            font-size: 14px;
        }
        .calendar-grid .day-header {
            font-weight: 600;
            background: transparent;
            color: var(--gray-500);
        }
        .calendar-grid .day-number {
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }
        .calendar-grid .day-number:hover {
            background: var(--primary);
            color: #fff;
        }
        .calendar-grid .day-number.has-event {
            background: var(--primary);
            color: #fff;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .search-box input,
        .search-box select {
            flex: 1;
            padding: 10px 16px;
            border: 1.5px solid var(--gray-200);
            border-radius: 10px;
            font-size: 14px;
            background: #fff;
            min-width: 140px;
        }
        .search-box input:focus,
        .search-box select:focus {
            border-color: var(--primary);
            outline: none;
        }
        .search-box button {
            padding: 10px 22px;
        }
        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 2px solid var(--gray-200);
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tabs .tab {
            padding: 10px 22px;
            cursor: pointer;
            font-weight: 600;
            color: var(--gray-500);
            border-bottom: 3px solid transparent;
            transition: var(--transition);
            font-size: 14px;
        }
        .tabs .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .tabs .tab:hover {
            color: var(--primary);
        }
        .vote-bar {
            height: 18px;
            background: var(--gray-200);
            border-radius: 20px;
            overflow: hidden;
            margin: 4px 0;
        }
        .vote-bar-inner {
            height: 100%;
            background: var(--primary);
            transition: width 0.3s;
        }
        .alert-item {
            border-left: 4px solid #f9a825;
            padding: 10px 14px;
            margin: 6px 0;
            background: var(--gray-100);
            border-radius: 8px;
        }
        .widget {
            border: 2px dashed var(--gray-300);
            border-radius: var(--border-radius);
            padding: 16px;
            background: #fff;
            transition: var(--transition);
            cursor: grab;
        }
        .widget:hover {
            border-color: var(--primary);
        }
        .widget .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .widget .widget-header .drag-handle {
            cursor: grab;
            color: var(--gray-400);
        }
        .widget .widget-header .remove-widget {
            cursor: pointer;
            color: #e74c3c;
        }
        .widgets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .maintenance-banner {
            background: #f9a825;
            color: #212529;
            padding: 12px 20px;
            text-align: center;
            font-weight: 600;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
        }
        @media (max-width: 1024px) {
            .grid-4 {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 768px) {
            #sidebar {
                transform: translateX(-100%);
                width: 280px;
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.08);
            }
            #sidebar.open {
                transform: translateX(0);
            }
            #main {
                margin-left: 0;
            }
            #header .left .toggle-sidebar {
                display: block;
            }
            #header .left .page-title {
                font-size: 17px;
            }
            #content {
                padding: 16px;
            }
            .grid-2,
            .grid-3,
            .grid-4 {
                grid-template-columns: 1fr;
            }
            .stat-card {
                padding: 14px;
            }
            .modal {
                padding: 20px;
            }
            .search-box input,
            .search-box select {
                min-width: 120px;
            }
            .tabs .tab {
                padding: 8px 14px;
                font-size: 13px;
            }
            .login-card {
                padding: 28px 20px;
                margin: 12px;
            }
            .widgets-grid {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 480px) {
            #header {
                padding: 0 12px;
            }
            #header .right .user-menu span {
                display: none;
            }
            .btn {
                font-size: 13px;
                padding: 6px 14px;
            }
            .table-responsive table {
                font-size: 13px;
            }
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--gray-100);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--gray-400);
        }
        #emergencyBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            z-index: 9998;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
            transition: var(--transition);
            opacity: 0.6;
        }
        #emergencyBtn:hover {
            opacity: 1;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="loginPage" class="active">
        <div class="login-card">
            <h1><i class="fas fa-school"></i> <span id="loginPlatformName">ENT Collège</span></h1>
            <p>Plateforme enseignants</p>
            <form id="loginForm">
                <label for="loginEmail">Adresse e-mail</label>
                <input type="email" id="loginEmail" placeholder="exemple@college.fr" required>
                <label for="loginPassword">Mot de passe</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
                <button type="submit"><i class="fas fa-arrow-right-to-bracket"></i> Se connecter</button>
                <div id="loginError" class="login-error"></div>
            </form>
        </div>
    </div>

    <!-- SIDEBAR -->
    <aside id="sidebar">
        <div class="brand"><i class="fas fa-graduation-cap"></i> <span id="platformName">ENT Collège</span></div>
        <div class="user-info">

        function getDataSync() {
            if (currentData) return currentData;
            const raw = localStorage.getItem('ent_data');
            if (raw) {
                try {
                    currentData = JSON.parse(raw);
                    return currentData;
                } catch (e) { /* ignore */ }
            }
            const defaultData = getDefaultData();
            currentData = defaultData;
            localStorage.setItem('ent_data', JSON.stringify(defaultData));
            // Si Firestore est activé, on tente une synchronisation initiale
            if (useFirestore && db) {
                db.collection('ent_data').doc('main').set(defaultData).catch(() => {});
            }
            return defaultData;
        }

        async function getData() {
            if (currentData) return currentData;
            // Tentative de chargement depuis Firestore si disponible
            if (useFirestore && db) {
                try {
                    const doc = await db.collection('ent_data').doc('main').get();
                    if (doc.exists) {
                        const data = doc.data();
                        const defaultData = getDefaultData();
                        for (let key in defaultData) {
                            if (!data.hasOwnProperty(key) || !Array.isArray(data[key])) {
                                data[key] = defaultData[key];
                            }
                        }
                        currentData = data;
                        localStorage.setItem('ent_data', JSON.stringify(data));
                        return data;
                    }
                } catch (e) {
                    console.warn('Firestore non accessible, fallback localStorage.');
                }
            }
            return getDataSync();
        }

        async function saveData(data) {
            currentData = data;
            localStorage.setItem('ent_data', JSON.stringify(data));
            if (useFirestore && db) {
                try {
                    await db.collection('ent_data').doc('main').set(data);
                } catch (e) {
                    console.warn('Sauvegarde Firestore échouée, donnée locale OK.');
                }
            }
        }

        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }

        // ================================================================
        //  SESSION
        // ================================================================
        let sessionTimer = null;
        const SESSION_CHECK = 10000;

        function getCurrentUser() {
            const session = JSON.parse(localStorage.getItem('ent_session') || 'null');
            if (!session) return null;
            if (session.expiry && Date.now() > session.expiry) { clearSession(); return null; }
            const data = getDataSync();
            const user = data.users.find(u => u.id === session.userId);
            if (!user || user.active === false) { clearSession(); return null; }
            renewSession(user.id);
            return user;
        }

        function renewSession(userId) {
            const data = getDataSync();
            const timeout = data.settings.security.sessionTimeout || 600;
            localStorage.setItem('ent_session', JSON.stringify({ userId, expiry: Date.now() + timeout * 1000 }));
            resetSessionTimer();
        }

        function setSession(userId) { renewSession(userId); }

        function clearSession() {
            localStorage.removeItem('ent_session');
            if (sessionTimer) clearInterval(sessionTimer);
            sessionTimer = null;
        }

        function resetSessionTimer() {
            if (sessionTimer) clearInterval(sessionTimer);
            sessionTimer = setInterval(() => {
                const session = JSON.parse(localStorage.getItem('ent_session') || 'null');
                if (!session) { clearInterval(sessionTimer);
                    sessionTimer = null; return; }
                if (session.expiry && Date.now() > session.expiry) { clearSession();
                    logoutUser(); }
            }, SESSION_CHECK);
        }

        function logoutUser() {
            const user = getCurrentUser();
            if (user) addLog('Déconnexion automatique', user.email);
            clearSession();
            document.getElementById('loginPage').classList.add('active');
            document.getElementById('main').style.display = 'none';
        }

        window.addEventListener('beforeunload', () => localStorage.setItem('ent_last_activity', Date.now()));
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) localStorage.setItem('ent_last_activity', Date.now());
            else {
                const last = parseInt(localStorage.getItem('ent_last_activity') || '0');
                const data = getDataSync();
                const timeout = (data.settings.security.sessionTimeout || 600) * 1000;
                if (Date.now() - last > timeout) { clearSession();
                    logoutUser(); } else { const u = getCurrentUser(); if (u) renewSession(u.id); }
            }
        });

        // ================================================================
        //  LOGS & NOTIFICATIONS
        // ================================================================
        async function addLog(action, details = '') {
            const data = await getData();
            const user = getCurrentUser();
            data.logs.push({
                id: generateId(),
                date: new Date().toISOString(),
                userId: user ? user.id : 'system',
                userName: user ? user.prenom + ' ' + user.nom : 'Système',
                action,
                details
            });
            await saveData(data);
        }

        async function addNotification(userId, message, type = 'info') {
            const data = await getData();
            data.notifications.push({ id: generateId(), userId, message, type, read: false, date: new Date()
                    .toISOString() });
            await saveData(data);
            updateNotifBadge();
        }

        function getUnreadNotifCount(userId) {
            const data = getDataSync();
            return data.notifications.filter(n => n.userId === userId && !n.read).length;
        }

        function updateNotifBadge() {
            const user = getCurrentUser();
            if (!user) return;
            document.getElementById('notifCount').textContent = getUnreadNotifCount(user.id);
        }

        // ================================================================
        //  AUTH
        // ================================================================
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const data = await getData();
            if (data.settings.maintenance && data.settings.maintenance.active) {
                const user = data.users.find(u => u.email === email && u.password === password && u.active !== false);
                if (!user || user.role !== 'admin') {
                    document.getElementById('loginError').textContent = data.settings.maintenance.message ||
                        'Plateforme en maintenance.';
                    return;
                }
            }
            const user = data.users.find(u => u.email === email && u.password === password && u.active !== false);
            if (user) {
                setSession(user.id);
                await addLog('Connexion', user.email);
                render();
                document.getElementById('loginError').textContent = '';
            } else {
                document.getElementById('loginError').textContent =
                'Email ou mot de passe incorrect, ou compte inactif.';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async function() {
            const user = getCurrentUser();
            if (user) await addLog('Déconnexion', user.email);
            clearSession();
            document.getElementById('loginPage').classList.add('active');
            document.getElementById('main').style.display = 'none';
        });

        // ================================================================
        //  PERMISSIONS
        // ================================================================
        function hasPermission(user, module, action) {
            if (!user) return false;
            if (user.role === 'admin') return true;
            const perms = user.permissions && user.permissions[module];
            if (!perms) return false;
            return perms[action] === true;
        }

        function isAdmin() { const u = getCurrentUser(); return u && u.role === 'admin'; }

        // ================================================================
        //  RENDU GLOBAL
        // ================================================================
        async function render() {
            const user = getCurrentUser();
            if (!user) {
                document.getElementById('loginPage').classList.add('active');
                document.getElementById('main').style.display = 'none';
                return;
            }
            document.getElementById('loginPage').classList.remove('active');
            document.getElementById('main').style.display = 'flex';
            const name = user.prenom + ' ' + user.nom;
            document.getElementById('sidebarName').textContent = name;
            document.getElementById('headerName').textContent = name;
            const avatar = (user.prenom.charAt(0) + user.nom.charAt(0)).toUpperCase();
            document.getElementById('sidebarAvatar').textContent = avatar;
            document.getElementById('headerAvatar').textContent = avatar;
            document.getElementById('sidebarRole').textContent = user.role === 'admin' ? 'Administrateur' : 'Enseignant';
            const data = await getData();
            document.getElementById('platformName').textContent = data.settings.platformName || 'ENT Collège';
            document.getElementById('loginPlatformName').textContent = data.settings.platformName || 'ENT Collège';
            buildMenu(user, data);
            updateNotifBadge();
            const activePage = document.querySelector('.page-section.active');
            if (activePage) loadPage(activePage.id.replace('page-', ''));
            else loadPage('dashboard');
        }

        function buildMenu(user, data) {
            const menu = document.getElementById('mainMenu');
            const items = [
                { id: 'dashboard', icon: 'fa-gauge-high', label: 'Tableau de bord' },
                { id: 'documents', icon: 'fa-folder-open', label: 'Documents' },
                { id: 'inscriptions', icon: 'fa-pen-to-square', label: 'Inscriptions' },
                { id: 'agenda', icon: 'fa-calendar-days', label: 'Agenda' },
                { id: 'salles', icon: 'fa-building', label: 'Salles' },
                { id: 'absences', icon: 'fa-user-slash', label: 'Absences' },
                { id: 'sondages', icon: 'fa-chart-simple', label: 'Sondages' },
                { id: 'reunions', icon: 'fa-handshake', label: 'Réunions' },
                { id: 'alertes', icon: 'fa-clock', label: 'Alertes' },
                { id: 'notifications', icon: 'fa-bell', label: 'Notifications' },
                { id: 'recherche', icon: 'fa-magnifying-glass', label: 'Recherche' },
                { id: 'statistiques', icon: 'fa-chart-pie', label: 'Statistiques' },
                { id: 'admin', icon: 'fa-gear', label: 'Administration', adminOnly: true },
                { id: 'parametres', icon: 'fa-sliders', label: 'Paramètres' },
                { id: 'droits', icon: 'fa-lock', label: 'Droits', adminOnly: true },
                { id: 'tableaudebord', icon: 'fa-table-cells-large', label: 'Tableau de bord perso.' },
                { id: 'edt', icon: 'fa-calendar-week', label: 'Emploi du temps (EDT)' },
                { id: 'maintenance', icon: 'fa-triangle-exclamation', label: 'Maintenance', adminOnly: true }
            ];
            let html = '';
            for (const item of items) {
                if (item.adminOnly && !isAdmin()) continue;
                if (data.settings.modules[item.id] === false) continue;
                const active = document.querySelector('.page-section.active')?.id === 'page-' + item.id ? 'active' : '';
                html += `<div class="menu-item ${active}" data-page="${item.id}"><i class="fas ${item.icon}"></i> ${item.label}</div>`;
            }
            menu.innerHTML = html;
            document.querySelectorAll('.menu-item').forEach(el => {
                el.addEventListener('click', function() {
                    const page = this.dataset.page;
                    loadPage(page);
                });
            });
        }

        function loadPage(pageId) {
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
            const target = document.getElementById('page-' + pageId);
            if (target) {
                target.classList.add('active');
                const menuItem = document.querySelector(`.menu-item[data-page="${pageId}"]`);
                document.getElementById('currentPageTitle').textContent = menuItem ? menuItem.textContent.trim() :
                    pageId;
                document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
                if (menuItem) menuItem.classList.add('active');
                renderPage(pageId);
            }
        }

        function renderPage(page) {
            switch (page) {
                case 'dashboard':
                    renderDashboard();

                    break;

                    renderInscriptions();
                    break;

                    break;

                    break;
                case 'sondages':

                    break;

                    break;
                case 'alertes':

                    break;
                case 'notifications':

                    break;
                case 'recherche':

                    break;
                case 'admin':

                    break;
                case 'statistiques':

                    break;
                case 'parametres':

                    break;
                case 'droits':
                    renderDroits();
                    break;
                case 'tableaudebord':

                    break;

                    break;
                case 'maintenance':
                    renderMaintenance();
                    break;
                default:
                    document.getElementById('page-dashboard').innerHTML = '<p>Page en construction</p>';
            }
        }

        // ================================================================

        function renderDashboard() {
            const data = getDataSync();
            const user = getCurrentUser();
            const absences = data.absences || [];
            const reservations = data.reservations || [];
            const notifications = data.notifications || [];
            const sondages = data.sondages || [];
            const reunions = data.reunions || [];
            const alertes = data.alertes || [];
            const absAtt = absences.filter(a => a.userId === user.id && a.statut === 'En attente').length;
            const resToday = reservations.filter(r => new Date(r.date).toDateString() === new Date().toDateString() && r
                .userId === user.id).length;
            const notifsUnread = notifications.filter(n => n.userId === user.id && !n.read).length;
            const sondagesActifs = sondages.filter(s => !s.cloture && new Date(s.dateFin) >= new Date()).length;
            const reunionsOpen = reunions.filter(r => r.statut === 'ouverte').length;
            const alertesUnread = alertes.filter(a => a.userId === user.id && !a.lu).length;

            let html = `
                <div class="grid-4">

        function renderMiniCalendar() {
            const c = document.getElementById('miniCalendar');
            if (!c) return;
            const now = new Date();
            const year = now.getFullYear(),
                month = now.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const days = new Date(year, month + 1, 0).getDate();
            let html = '<div class="calendar-grid">';
            const jours = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
            for (let j of jours) html += `<div class="day day-header">${j}</div>`;
            for (let i = 0; i < (firstDay === 0 ? 6 : firstDay - 1); i++) html += `<div class="day"></div>`;
            for (let d = 1; d <= days; d++) html += `<div class="day day-number">${d}</div>`;
            html += '</div>';
            c.innerHTML = html;
        }

        function setAgendaView(view) {
            document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.tabs .tab[data-view="${view}"]`)?.classList.add('active');
            const container = document.getElementById('agendaView');
            const data = getDataSync();
            const events = data.agenda_events || [];
            if (view === 'jour') {
                const today = new Date().toDateString();
                const dayEvents = events.filter(e => new Date(e.date).toDateString() === today);
                container.innerHTML = `<div class="card">
                    <h4>Événements du ${new Date().toLocaleDateString()}</h4>
                    ${dayEvents.length ? dayEvents.map(e => `
                        <div style="border-left:4px solid ${e.couleur||'#4361ee'}; padding:8px 12px; margin:6px 0; background:var(--gray-100); border-radius:8px;">
                            <strong>${e.titre}</strong> - ${e.heure||''} ${e.lieu ? '📍 '+e.lieu : ''}
                            ${isAdmin() ? `<button class="btn btn-sm btn-danger" onclick="deleteAgendaEvent('${e.id}')"><i class="fas fa-trash"></i></button>` : ''}
                        </div>
                    `).join('') : '<p class="text-muted">Aucun événement.</p>'}
                </div>`;
            } else if (view === 'semaine') {
                const today = new Date();
                let html = `<div class="card"><h4>Semaine du ${today.toLocaleDateString()}</h4>`;
                for (let i = 0; i < 7; i++) {
                    const d = new Date(today);
                    d.setDate(d.getDate() + i);
                    const dayEvents = events.filter(e => new Date(e.date).toDateString() === d.toDateString());
                    html += `<div style="padding:6px 12px; background:var(--gray-100); border-radius:6px; margin:4px 0;">
                        <strong>${d.toLocaleDateString()}</strong> : ${dayEvents.length ? dayEvents.map(e=>e.titre).join(', ') : 'Aucun'}
                    </div>`;
                }
                html += '</div>';
                container.innerHTML = html;
            } else if (view === 'mois') {
                const mois = ['Janv', 'Févr', 'Mars', 'Avr', 'Mai', 'Juin', 'Juil', 'Août', 'Sept', 'Oct', 'Nov', 'Déc'];
                const now = new Date();
                const year = now.getFullYear(),
                    month = now.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const days = new Date(year, month + 1, 0).getDate();
                let html = `<div class="card"><h4>${mois[month]} ${year}</h4><div class="calendar-grid">`;
                const jours = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
                for (let j of jours) html += `<div class="day day-header">${j}</div>`;
                for (let i = 0; i < (firstDay === 0 ? 6 : firstDay - 1); i++) html += `<div class="day"></div>`;
                for (let d = 1; d <= days; d++) {
                    const dateObj = new Date(year, month, d);
                    const hasEvent = events.some(e => new Date(e.date).toDateString() === dateObj.toDateString());
                    html += `<div class="day day-number ${hasEvent?'has-event':''}">${d}</div>`;
                }
                html += '</div></div>';
                container.innerHTML = html;
            }
        }

        // --- Tableau de bord personnalisable ---
        function renderTableauDeBord() {
            const data = getDataSync();
            const user = getCurrentUser();
            const widgets = data.widgets.filter(w => w.userId === user.id);
            let html = `
                <div class="page-title">Tableau de bord personnalisable</div>
                <div class="page-subtitle">Ajoutez, supprimez et organisez vos widgets</div>
                <button class="btn btn-primary mb-20" onclick="ajouterWidget()"><i class="fas fa-plus"></i> Ajouter un widget</button>
                <div class="widgets-grid" id="widgetsGrid">
                    ${widgets.map(w => {
                        let content = '';
                        if (w.type === 'agenda') {
                            const now = new Date();
                            const days = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
                            let cal = '<div class="calendar-grid">';
                            for (let i=0; i<7; i++) {
                                const d = new Date(now);
                                d.setDate(d.getDate() + i - now.getDay());
                                cal += `<div class="day day-header">${days[d.getDay()]}</div>`;
                            }
                            for (let i=0; i<7; i++) {
                                const d = new Date(now);
                                d.setDate(d.getDate() + i - now.getDay());
                                cal += `<div class="day day-number">${d.getDate()}</div>`;
                            }
                            cal += '</div>';
                            content = `<div>${cal}</div>`;
                        } else if (w.type === 'notifications') {
                            const notifs = data.notifications.filter(n => n.userId === user.id).slice(0, w.config.nb || 5);
                            content = notifs.map(n => `<div style="padding:4px 0; border-bottom:1px solid var(--gray-100);">${n.message}</div>`).join('') || '<p class="text-muted">Aucune notification</p>';
                        } else if (w.type === 'stats') {
                            const abs = data.absences.filter(a => a.userId === user.id).length;
                            const reserv = data.reservations.filter(r => r.userId === user.id).length;
                            const votes = data.sondages.flatMap(s => s.votes||[]).filter(v => v.userId === user.id).length;
                            content = `<div><strong>Absences:</strong> ${abs}</div><div><strong>Réservations:</strong> ${reserv}</div><div><strong>Votes:</strong> ${votes}</div>`;
                        } else {
                            content = '<p class="text-muted">Widget inconnu</p>';
                        }
                        return `
                            <div class="widget" draggable="true" data-widget-id="${w.id}">
                                <div class="widget-header">
                                    <span>${w.config.titre || w.type}</span>
                                    <div>
                                        <span class="drag-handle"><i class="fas fa-grip-vertical"></i></span>
                                        <span class="remove-widget" onclick="supprimerWidget('${w.id}')"><i class="fas fa-times"></i></span>
                                    </div>
                                </div>
                                ${content}
                            </div>
                        `;
                    }).join('')}
                </div>
                <p class="text-muted" style="margin-top:10px;">💡 Glissez-déposez les widgets pour les réorganiser.</p>
            `;
            document.getElementById('page-tableaudebord').innerHTML = html;
            // Drag & drop
            const grid = document.getElementById('widgetsGrid');
            if (grid) {
                let dragEl = null;
                grid.querySelectorAll('.widget').forEach(el => {
                    el.addEventListener('dragstart', function(e) {
                        dragEl = this;
                        this.style.opacity = '0.5';
                        e.dataTransfer.effectAllowed = 'move';
                    });
                    el.addEventListener('dragend', function(e) {
                        this.style.opacity = '1';
                    });
                    el.addEventListener('dragover', function(e) {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                    });
                    el.addEventListener('drop', function(e) {
                        e.preventDefault();
                        if (dragEl && dragEl !== this) {
                            const parent = this.parentNode;
                            const children = Array.from(parent.children);
                            const idx1 = children.indexOf(dragEl);
                            const idx2 = children.indexOf(this);
                            if (idx1 < idx2) {
                                this.parentNode.insertBefore(dragEl, this.nextSibling);
                            } else {
                                this.parentNode.insertBefore(dragEl, this);
                            }
                            // Sauvegarder l'ordre (simulé)
                            const order = Array.from(parent.children).map(el => el.dataset.widgetId);
                            const data = getDataSync();
                            const widgets = data.widgets;
                            const newOrder = order.map(id => widgets.find(w => w.id === id)).filter(Boolean);
                            data.widgets = newOrder;
                            saveData(data);
                            addLog('Réorganisation des widgets');
                        }
                    });
                });
            }
        }

            const container = document.getElementById('searchResults');
            if (!q) { container.innerHTML = '<p class="text-muted">Saisissez un terme.</p>'; return; }
            const data = getDataSync();
            const results = [];
            (data.users || []).forEach(u => { if ((u.nom + u.prenom + u.email).toLowerCase().includes(q)) results.push({
                    type: 'Utilisateur',
                    label: u.prenom + ' ' + u.nom + ' (' + u.email + ')'
                }); });
            (data.salles || []).forEach(s => { if ((s.nom + s.batiment + s.equipements).toLowerCase().includes(q))
                    results.push({ type: 'Salle', label: s.nom }); });
            (data.documents || []).forEach(d => { if (d.nom.toLowerCase().includes(q)) results.push({ type: 'Document',
                    label: d.nom }); });
            (data.evenements || []).forEach(e => { if ((e.titre + e.description).toLowerCase().includes(q)) results
                    .push({ type: 'Événement', label: e.titre }); });
            (data.absences || []).forEach(a => { if ((a.motif + a.commentaire).toLowerCase().includes(q)) { const u =
                        data.users.find(u => u.id === a.userId);
                    results.push({ type: 'Absence', label: (u ? u.prenom + ' ' + u.nom : '') + ' - ' + a.motif }); } });
            (data.sondages || []).forEach(s => { if ((s.titre + s.description).toLowerCase().includes(q)) results.push({
                    type: 'Sondage',
                    label: s.titre
                }); });
            container.innerHTML = results.length ? results.map(r =>
                `<div style="padding:6px 0; border-bottom:1px solid var(--gray-100);"><strong>${r.type}</strong> : ${r.label}</div>`
                ).join('') : '<p class="text-muted">Aucun résultat.</p>';

        // Droits
        window.editDroits = function(userId, module) {
            const data = getDataSync();
            const user = data.users.find(u => u.id === userId);
            if (!user) return;
            if (!user.permissions) user.permissions = {};
            const p = user.permissions[module] || { read: false, write: false, delete: false };
            const body = document.getElementById('modalBody');
            body.innerHTML = `
                <h2>Droits pour ${user.prenom} ${user.nom} - ${module}</h2>
                <form id="droitsForm">
                    <div><input type="checkbox" id="dRead" ${p.read?'checked':''}> <label for="dRead">Lecture</label></div>
                    <div><input type="checkbox" id="dWrite" ${p.write?'checked':''}> <label for="dWrite">Écriture</label></div>
                    <div><input type="checkbox" id="dDelete" ${p.delete?'checked':''}> <label for="dDelete">Suppression</label></div>
                    <button type="submit" class="btn btn-primary btn-block">Enregistrer</button>
                </form>
            `;
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('droitsForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const data = await getData();
                const user2 = data.users.find(u => u.id === userId);
                if (!user2) return;
                user2.permissions[module] = { read: document.getElementById('dRead').checked, write: document
                        .getElementById('dWrite').checked, delete: document.getElementById('dDelete')
                        .checked };
                await saveData(data);
                await addLog('Modification droits', user2.email + ' - ' + module);
                closeModal();
                renderDroits();
            });
        };

        // ================================================================
        //  INIT
        // ================================================================
        (async function() {
            // Forcer les données par défaut si vide
            const data = getDataSync();
            // Démarrer l'application
            const session = JSON.parse(localStorage.getItem('ent_session') || 'null');
            if (session) {
                const user = data.users.find(u => u.id === session.userId);
                if (user && user.active !== false && session.expiry && Date.now() < session.expiry) {
                    render();
                    await addLog('Session reprise', user.email);
                    renewSession(user.id);
                } else {
                    clearSession();
                    document.getElementById('loginPage').classList.add('active');
                }
            } else {
                document.getElementById('loginPage').classList.add('active');
            }

            document.getElementById('notificationBell').addEventListener('click', function() { loadPage('notifications'); });
            document.getElementById('toggleSidebar').addEventListener('click', function() {
                document.getElementById('sidebar').classList.toggle('open');
            });

            console.log('✅ ENT Collège prêt (mode local).');
            console.log('📌 Admin: admin@college.fr / Admin123!');
            console.log('🔑 Secours: Ctrl+Alt+D ou bouton en bas à droite');
