<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ENT Collège - Plateforme Enseignants</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        /* --- CSS identique à la version précédente (raccourci) --- */
        :root { --primary: #4361ee; --primary-light: #6c8cff; --primary-dark: #2a3fa8; --secondary: #f72585; --success: #4caf50; --danger: #e74c3c; --warning: #f9a825; --info: #42a5f5; --gray-50: #f8fafc; --gray-100: #f1f5f9; --gray-200: #e2e8f0; --gray-300: #cbd5e1; --gray-400: #94a3b8; --gray-500: #64748b; --gray-600: #475569; --gray-700: #334155; --gray-800: #1e293b; --gray-900: #0f172a; --sidebar-width: 260px; --header-height: 64px; --border-radius: 16px; --box-shadow: 0 4px 20px rgba(0,0,0,0.06); --transition: all 0.25s ease; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--gray-50); color: var(--gray-800); display: flex; height: 100vh; overflow: hidden; }
        #loginPage { display:none; position:fixed; inset:0; background:linear-gradient(145deg,#eef2ff,#e0e7ff); justify-content:center; align-items:center; z-index:9999; }
        #loginPage.active { display:flex; }
        .login-card { background:#fff; padding:40px 32px; border-radius:var(--border-radius); box-shadow:0 25px 60px rgba(67,97,238,0.15); width:100%; max-width:400px; }
        .login-card h1 { font-size:28px; font-weight:700; color:var(--primary); text-align:center; margin-bottom:6px; }
        .login-card p { text-align:center; color:var(--gray-500); margin-bottom:24px; font-size:15px; }
        .login-card label { font-weight:600; display:block; font-size:14px; margin-top:16px; margin-bottom:4px; color:var(--gray-700); }
        .login-card input { width:100%; padding:12px 16px; border:1.5px solid var(--gray-200); border-radius:10px; font-size:15px; background:var(--gray-50); transition:var(--transition); }
        .login-card input:focus { border-color:var(--primary); outline:none; background:#fff; box-shadow:0 0 0 3px rgba(67,97,238,0.12); }
        .login-card button { width:100%; padding:14px; background:var(--primary); color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:600; margin-top:22px; cursor:pointer; transition:var(--transition); box-shadow:0 4px 12px rgba(67,97,238,0.3); }
        .login-card button:hover { background:var(--primary-dark); transform:translateY(-1px); }
        .login-error { color:var(--danger); font-size:14px; margin-top:12px; text-align:center; }
        #sidebar { width:var(--sidebar-width); background:#fff; border-right:1px solid var(--gray-200); display:flex; flex-direction:column; height:100vh; position:fixed; top:0; left:0; z-index:1000; transition:var(--transition); overflow-y:auto; }
        #sidebar .brand { display:flex; align-items:center; gap:12px; padding:20px 20px 14px; font-size:20px; font-weight:700; color:var(--primary); border-bottom:1px solid var(--gray-200); }
        #sidebar .brand i { font-size:26px; }
        #sidebar .user-info { padding:16px 20px; border-bottom:1px solid var(--gray-200); display:flex; align-items:center; gap:14px; }
        #sidebar .user-info .avatar { width:44px; height:44px; border-radius:12px; background:var(--primary-light); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; flex-shrink:0; }
        #sidebar .user-info .name { font-weight:600; font-size:15px; }
        #sidebar .user-info .role { font-size:12px; color:var(--gray-500); }
        #sidebar .menu { flex:1; padding:10px 0 20px; }
        #sidebar .menu .menu-item { display:flex; align-items:center; gap:14px; padding:12px 20px; color:var(--gray-600); font-size:15px; cursor:pointer; transition:var(--transition); border-left:3px solid transparent; font-weight:500; }
        #sidebar .menu .menu-item:hover { background:var(--gray-100); color:var(--primary); }
        #sidebar .menu .menu-item.active { background:rgba(67,97,238,0.08); color:var(--primary); border-left-color:var(--primary); font-weight:600; }
        #sidebar .menu .menu-item i { width:22px; text-align:center; font-size:17px; }
        #sidebar .menu .menu-item .badge { margin-left:auto; background:var(--secondary); color:#fff; font-size:11px; padding:2px 8px; border-radius:20px; }
        #sidebar .logout-btn { padding:16px 20px; border-top:1px solid var(--gray-200); color:var(--danger); font-weight:600; cursor:pointer; display:flex; align-items:center; gap:12px; transition:var(--transition); }
        #sidebar .logout-btn:hover { background:#fef2f2; }
        #main { margin-left:var(--sidebar-width); flex:1; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
        #header { height:var(--header-height); background:#fff; border-bottom:1px solid var(--gray-200); display:flex; align-items:center; justify-content:space-between; padding:0 24px; flex-shrink:0; }
        #header .left { display:flex; align-items:center; gap:16px; }
        #header .left .toggle-sidebar { display:none; background:none; border:none; font-size:22px; cursor:pointer; color:var(--gray-600); padding:4px 8px; }
        #header .left .page-title { font-size:20px; font-weight:700; color:var(--gray-800); }
        #header .right { display:flex; align-items:center; gap:20px; }
        #header .right .notification-bell { position:relative; cursor:pointer; font-size:20px; color:var(--gray-600); transition:var(--transition); }
        #header .right .notification-bell:hover { color:var(--primary); }
        #header .right .notification-bell .count { position:absolute; top:-6px; right:-8px; background:var(--secondary); color:#fff; font-size:11px; border-radius:30px; padding:1px 7px; min-width:20px; text-align:center; font-weight:600; }
        #header .right .user-menu { display:flex; align-items:center; gap:10px; cursor:pointer; padding:6px 12px 6px 8px; border-radius:30px; transition:var(--transition); }
        #header .right .user-menu:hover { background:var(--gray-100); }
        #header .right .user-menu .avatar-sm { width:34px; height:34px; border-radius:10px; background:var(--primary-light); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; }
        #header .right .user-menu span { font-weight:500; font-size:14px; color:var(--gray-700); }
        #content { flex:1; padding:24px 28px; overflow-y:auto; background:var(--gray-50); }
        .page-section { display:none; animation:fadeUp 0.3s ease; }
        .page-section.active { display:block; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
        .page-title { font-size:24px; font-weight:700; margin-bottom:4px; color:var(--gray-900); }
        .page-subtitle { color:var(--gray-500); margin-bottom:24px; font-size:15px; }
        .card { background:#fff; border-radius:var(--border-radius); box-shadow:var(--box-shadow); padding:20px 22px; margin-bottom:20px; transition:var(--transition); border:1px solid var(--gray-100); }
        .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; font-weight:600; font-size:18px; color:var(--gray-800); }
        .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
        .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
        .grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; }
        .stat-card { background:#fff; border-radius:var(--border-radius); padding:18px 20px; box-shadow:var(--box-shadow); border:1px solid var(--gray-100); display:flex; align-items:center; gap:16px; }
        .stat-card .icon { width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; color:#fff; flex-shrink:0; }
        .stat-card .icon.blue { background:var(--primary); }
        .stat-card .icon.green { background:var(--success); }
        .stat-card .icon.orange { background:var(--warning); }
        .stat-card .icon.red { background:var(--danger); }
        .stat-card .icon.purple { background:#8b5cf6; }
        .stat-card .icon.pink { background:var(--secondary); }
        .stat-card .info h3 { font-size:26px; font-weight:700; line-height:1.2; }
        .stat-card .info span { color:var(--gray-500); font-size:14px; }
        .btn { padding:8px 18px; border-radius:10px; border:none; font-weight:600; font-size:14px; cursor:pointer; transition:var(--transition); display:inline-flex; align-items:center; gap:6px; text-decoration:none; }
        .btn-primary { background:var(--primary); color:#fff; box-shadow:0 2px 8px rgba(67,97,238,0.25); }
        .btn-primary:hover { background:var(--primary-dark); transform:translateY(-1px); }
        .btn-success { background:var(--success); color:#fff; }
        .btn-success:hover { background:#388e3c; }
        .btn-danger { background:var(--danger); color:#fff; }
        .btn-danger:hover { background:#c62828; }
        .btn-warning { background:var(--warning); color:#212529; }
        .btn-warning:hover { background:#f57f17; }
        .btn-outline { background:transparent; border:1.5px solid var(--gray-300); color:var(--gray-700); }
        .btn-outline:hover { background:var(--gray-100); }
        .btn-sm { padding:5px 12px; font-size:12px; border-radius:8px; }
        .btn-block { width:100%; justify-content:center; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-weight:600; font-size:14px; margin-bottom:4px; color:var(--gray-700); }
        .form-group input, .form-group select, .form-group textarea { width:100%; padding:10px 14px; border:1.5px solid var(--gray-200); border-radius:10px; font-size:14px; background:var(--gray-50); transition:var(--transition); }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--primary); outline:none; background:#fff; box-shadow:0 0 0 3px rgba(67,97,238,0.12); }
        .form-group textarea { min-height:80px; resize:vertical; }
        .table-responsive { overflow-x:auto; -webkit-overflow-scrolling:touch; }
        table { width:100%; border-collapse:collapse; font-size:14px; }
        table th { text-align:left; padding:12px 10px; background:var(--gray-50); font-weight:600; color:var(--gray-600); border-bottom:2px solid var(--gray-200); }
        table td { padding:12px 10px; border-bottom:1px solid var(--gray-100); }
        table tr:hover td { background:var(--gray-50); }
        .badge-status { display:inline-block; padding:4px 14px; border-radius:30px; font-size:12px; font-weight:600; }
        .badge-status.pending { background:#fff3cd; color:#856404; }
        .badge-status.accepted { background:#d4edda; color:#155724; }
        .badge-status.refused { background:#f8d7da; color:#721c24; }
        .badge-status.active { background:#d1ecf1; color:#0c5460; }
        .badge-status.inactive { background:#e2e3e5; color:#383d41; }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.35); backdrop-filter:blur(4px); display:none; justify-content:center; align-items:center; z-index:9999; padding:16px; }
        .modal-overlay.active { display:flex; }
        .modal { background:#fff; border-radius:var(--border-radius); max-width:680px; width:100%; max-height:90vh; overflow-y:auto; padding:28px 30px; box-shadow:0 30px 80px rgba(0,0,0,0.2); animation:fadeUp 0.25s ease; }
        .modal h2 { margin-bottom:20px; font-size:22px; }
        .modal .close-modal { float:right; background:none; border:none; font-size:24px; cursor:pointer; color:var(--gray-400); transition:var(--transition); }
        .modal .close-modal:hover { color:var(--gray-700); }
        .calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
        .calendar-grid .day { padding:8px 4px; text-align:center; border-radius:8px; background:var(--gray-50); font-size:14px; }
        .calendar-grid .day-header { font-weight:600; background:transparent; color:var(--gray-500); }
        .calendar-grid .day-number { font-weight:500; cursor:pointer; transition:var(--transition); }
        .calendar-grid .day-number:hover { background:var(--primary-light); color:#fff; }
        .calendar-grid .day-number.has-event { background:var(--primary); color:#fff; }
        .search-box { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
        .search-box input, .search-box select { flex:1; padding:10px 16px; border:1.5px solid var(--gray-200); border-radius:10px; font-size:14px; background:var(--gray-50); min-width:140px; }
        .search-box input:focus, .search-box select:focus { border-color:var(--primary); outline:none; }
        .search-box button { padding:10px 22px; }
        .tabs { display:flex; gap:4px; border-bottom:2px solid var(--gray-200); margin-bottom:20px; flex-wrap:wrap; }
        .tabs .tab { padding:10px 22px; cursor:pointer; font-weight:600; color:var(--gray-500); border-bottom:3px solid transparent; transition:var(--transition); font-size:14px; }
        .tabs .tab.active { color:var(--primary); border-bottom-color:var(--primary); }
        .tabs .tab:hover { color:var(--primary); }
        .vote-bar { height:18px; background:var(--gray-200); border-radius:20px; overflow:hidden; margin:4px 0; }
        .vote-bar-inner { height:100%; background:var(--primary); transition:width 0.3s; }
        .alert-item { border-left:4px solid var(--warning); padding:10px 14px; margin:6px 0; background:var(--gray-50); border-radius:8px; }
        .reunion-creneau { border:1px solid var(--gray-200); border-radius:10px; padding:10px; margin:6px 0; cursor:pointer; transition:var(--transition); }
        .reunion-creneau:hover { background:var(--gray-50); }
        .reunion-creneau.selected { border-color:var(--success); background:#e8f5e9; }
        .permission-badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:11px; font-weight:600; margin:2px; }
        .perm-read { background:#d4edda; color:#155724; }
        .perm-write { background:#cce5ff; color:#004085; }
        .perm-delete { background:#f8d7da; color:#721c24; }
        .perm-none { background:#e2e3e5; color:#383d41; }
        @media (max-width:1024px) { .grid-4 { grid-template-columns:1fr 1fr; } }
        @media (max-width:768px) {
            #sidebar { transform:translateX(-100%); width:280px; box-shadow:4px 0 20px rgba(0,0,0,0.08); }
            #sidebar.open { transform:translateX(0); }
            #main { margin-left:0; }
            #header .left .toggle-sidebar { display:block; }
            #header .left .page-title { font-size:17px; }
            #content { padding:16px; }
            .grid-2, .grid-3, .grid-4 { grid-template-columns:1fr; }
            .stat-card { padding:14px; }
            .modal { padding:20px; }
            .search-box input, .search-box select { min-width:120px; }
            .tabs .tab { padding:8px 14px; font-size:13px; }
            .login-card { padding:28px 20px; margin:12px; }
        }
        @media (max-width:480px) {
            #header { padding:0 12px; }
            #header .right .user-menu span { display:none; }
            .btn { font-size:13px; padding:6px 14px; }
            .table-responsive table { font-size:13px; }
        }
        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-track { background:var(--gray-100); }
        ::-webkit-scrollbar-thumb { background:var(--gray-300); border-radius:10px; }
        ::-webkit-scrollbar-thumb:hover { background:var(--gray-400); }
        #emergencyBtn { position:fixed; bottom:20px; right:20px; background:var(--danger); color:#fff; border:none; border-radius:50px; padding:8px 16px; font-size:12px; font-weight:600; cursor:pointer; z-index:9998; box-shadow:0 4px 12px rgba(231,76,60,0.4); transition:var(--transition); opacity:0.6; }
        #emergencyBtn:hover { opacity:1; transform:scale(1.05); }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="loginPage" class="active">
        <div class="login-card">
            <h1><i class="fas fa-school"></i> <span id="loginPlatformName">ENT Collège</span></h1>
            <p>Plateforme enseignants</p>
            <form id="loginForm">
                <label for="loginEmail">Adresse e-mail</label>
                <input type="email" id="loginEmail" placeholder="exemple@college.fr" required>
                <label for="loginPassword">Mot de passe</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
                <button type="submit"><i class="fas fa-arrow-right-to-bracket"></i> Se connecter</button>
                <div id="loginError" class="login-error"></div>
            </form>
        </div>
    </div>

    <!-- SIDEBAR -->
    <aside id="sidebar">
        <div class="brand"><i class="fas fa-graduation-cap"></i> <span id="platformName">ENT Collège</span></div>
        <div class="user-info">
            <div class="avatar" id="sidebarAvatar">A</div>
            <div><div class="name" id="sidebarName">Admin</div><div class="role" id="sidebarRole">Administrateur</div></div>
        </div>
        <nav class="menu" id="mainMenu"></nav>
        <div class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Déconnexion</div>
    </aside>

    <!-- MAIN -->
    <div id="main" style="display:none;">
        <header id="header">
            <div class="left">
                <button class="toggle-sidebar" id="toggleSidebar"><i class="fas fa-bars"></i></button>
                <span class="page-title" id="currentPageTitle">Tableau de bord</span>
            </div>
            <div class="right">
                <div class="notification-bell" id="notificationBell">
                    <i class="fas fa-bell"></i>
                    <span class="count" id="notifCount">0</span>
                </div>
                <div class="user-menu" id="userMenuHeader">
                    <div class="avatar-sm" id="headerAvatar">A</div>
                    <span id="headerName">Admin</span>
                </div>
            </div>
        </header>
        <div id="content">
            <div id="page-dashboard" class="page-section active"></div>
            <div id="page-documents" class="page-section"></div>
            <div id="page-inscriptions" class="page-section"></div>
            <div id="page-agenda" class="page-section"></div>
            <div id="page-salles" class="page-section"></div>
            <div id="page-absences" class="page-section"></div>
            <div id="page-sondages" class="page-section"></div>
            <div id="page-reunions" class="page-section"></div>
            <div id="page-alertes" class="page-section"></div>
            <div id="page-notifications" class="page-section"></div>
            <div id="page-recherche" class="page-section"></div>
            <div id="page-admin" class="page-section"></div>
            <div id="page-statistiques" class="page-section"></div>
            <div id="page-parametres" class="page-section"></div>
            <div id="page-droits" class="page-section"></div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <button class="close-modal" id="modalClose"><i class="fas fa-times"></i></button>
            <div id="modalBody"></div>
        </div>
    </div>

        // ---------- INITIALISATION ROBUSTE ----------
        function initData() {
            let data;
            if (!localStorage.getItem('ent_data')) {
                data = getDefaultData();
            } else {
                try {
                    data = JSON.parse(localStorage.getItem('ent_data'));
                    const defaultData = getDefaultData();
                    for (let key in defaultData) {
                        if (!data.hasOwnProperty(key) || !Array.isArray(data[key])) {
                            data[key] = defaultData[key];
                        }
                    }
                    if (!data.settings) data.settings = defaultData.settings;
                    if (!data.settings.modules) data.settings.modules = defaultData.settings.modules;
                    if (!data.settings.security) data.settings.security = defaultData.settings.security;
                } catch (e) {
                    data = getDefaultData();
                }
            }
            const arrays = ['users','documents','evenements','inscriptions','salles','reservations','absences','notifications','logs','agenda_events','sondages','reunions','alertes','categories_documents'];
            arrays.forEach(key => { if (!Array.isArray(data[key])) data[key] = []; });
            const admin = data.users.find(u => u.role === 'admin');
            if (admin) {
                const modules = Object.keys(data.settings.modules);
                modules.forEach(m => {
                    if (!admin.permissions) admin.permissions = {};
                    if (!admin.permissions[m]) admin.permissions[m] = { read: true, write: true, delete: true };
                });
            }
            localStorage.setItem('ent_data', JSON.stringify(data));
        }
        function getData() {
            const raw = localStorage.getItem('ent_data');
            if (!raw) return getDefaultData();
            try { return JSON.parse(raw); } catch(e) { return getDefaultData(); }
        }
        function saveData(data) { localStorage.setItem('ent_data', JSON.stringify(data)); }
        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }

        // ---------- SESSION ----------
        let sessionTimer = null;
        const SESSION_CHECK = 10000;
        function getCurrentUser() {
            const session = JSON.parse(localStorage.getItem('ent_session')||'null');
            if (!session) return null;
            if (session.expiry && Date.now() > session.expiry) { clearSession(); return null; }
            const data = getData();
            const user = data.users.find(u => u.id === session.userId);
            if (!user || user.active === false) { clearSession(); return null; }
            renewSession(user.id);
            return user;
        }
        function renewSession(userId) {
            const data = getData();
            const timeout = data.settings.security.sessionTimeout || 600;
            localStorage.setItem('ent_session', JSON.stringify({ userId, expiry: Date.now() + timeout*1000 }));
            resetSessionTimer();
        }
        function setSession(userId) { renewSession(userId); }
        function clearSession() { localStorage.removeItem('ent_session'); if(sessionTimer) clearInterval(sessionTimer); sessionTimer=null; }
        window.addEventListener('beforeunload', ()=>localStorage.setItem('ent_last_activity', Date.now()));
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) localStorage.setItem('ent_last_activity', Date.now());
            else {
                const last = parseInt(localStorage.getItem('ent_last_activity')||'0');
                const data = getData();
                const timeout = (data.settings.security.sessionTimeout||600)*1000;
                if (Date.now() - last > timeout) { clearSession(); logoutUser(); }
                else { const u = getCurrentUser(); if (u) renewSession(u.id); }
            }
        });
        function resetSessionTimer() {
            if (sessionTimer) clearInterval(sessionTimer);
            sessionTimer = setInterval(() => {
                const session = JSON.parse(localStorage.getItem('ent_session')||'null');
                if (!session) { clearInterval(sessionTimer); sessionTimer=null; return; }
                if (session.expiry && Date.now() > session.expiry) { clearSession(); logoutUser(); }
            }, SESSION_CHECK);
        }
        function logoutUser() {
            const user = getCurrentUser();
            if (user) addLog('Déconnexion automatique', user.email);
            clearSession();
            document.getElementById('loginPage').classList.add('active');
            document.getElementById('main').style.display = 'none';
        }

        // ---------- LOGS & NOTIFICATIONS ----------
        function addLog(action, details='') {
            const data = getData();
            const user = getCurrentUser();
            data.logs.push({ id:generateId(), date:new Date().toISOString(),
                userId:user?user.id:'system', userName:user?user.prenom+' '+user.nom:'Système',
                action, details });
            saveData(data);
        }
        function addNotification(userId, message, type='info', lien='') {
            const data = getData();
            data.notifications.push({ id:generateId(), userId, message, type, lien, read:false, date:new Date().toISOString() });
            saveData(data);
            updateNotifBadge();
        }
        function getUnreadNotifCount(userId) {
            const data = getData();
            return data.notifications.filter(n => n.userId === userId && !n.read).length;
        }
        function updateNotifBadge() {
            const user = getCurrentUser();
            if (!user) return;
            document.getElementById('notifCount').textContent = getUnreadNotifCount(user.id);
        }

        // ---------- AUTH ----------
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const data = getData();
            const user = data.users.find(u => u.email === email && u.password === password && u.active !== false);
            if (user) {
                setSession(user.id);
                addLog('Connexion', user.email);
                localStorage.setItem('ent_last_activity', Date.now());
                render();
                document.getElementById('loginError').textContent = '';
            } else {
                document.getElementById('loginError').textContent = 'Email ou mot de passe incorrect, ou compte inactif.';
            }
        });
        document.getElementById('logoutBtn').addEventListener('click', function() {
            const user = getCurrentUser();
            if (user) addLog('Déconnexion', user.email);
            clearSession();
            document.getElementById('loginPage').classList.add('active');
            document.getElementById('main').style.display = 'none';
        });

        // ---------- PERMISSIONS ----------
        function hasPermission(user, module, action) {
            if (!user) return false;
            if (user.role === 'admin') return true;
            const perms = user.permissions && user.permissions[module];
            if (!perms) return false;
            return perms[action] === true;
        }
        function canRead(user, module) { return hasPermission(user, module, 'read'); }
        function canWrite(user, module) { return hasPermission(user, module, 'write'); }
        function canDelete(user, module) { return hasPermission(user, module, 'delete'); }
        function isAdmin() { const u = getCurrentUser(); return u && u.role === 'admin'; }

        // ---------- RENDU GLOBAL ----------
        function render() {
            const user = getCurrentUser();
            if (!user) {
                document.getElementById('loginPage').classList.add('active');
                document.getElementById('main').style.display = 'none';
                return;
            }
            document.getElementById('loginPage').classList.remove('active');
            document.getElementById('main').style.display = 'flex';
            const name = user.prenom+' '+user.nom;
            document.getElementById('sidebarName').textContent = name;
            document.getElementById('headerName').textContent = name;
            const avatar = (user.prenom.charAt(0)+user.nom.charAt(0)).toUpperCase();
            document.getElementById('sidebarAvatar').textContent = avatar;
            document.getElementById('headerAvatar').textContent = avatar;
            document.getElementById('sidebarRole').textContent = user.role==='admin'?'Administrateur':'Enseignant';
            const data = getData();
            document.getElementById('platformName').textContent = data.settings.platformName || 'ENT Collège';
            document.getElementById('loginPlatformName').textContent = data.settings.platformName || 'ENT Collège';
            buildMenu(user, data);
            updateNotifBadge();
            const activePage = document.querySelector('.page-section.active');
            if (activePage) loadPage(activePage.id.replace('page-',''));
            else loadPage('dashboard');
            localStorage.setItem('ent_last_activity', Date.now());
        }

        // ---------- MENU ----------
        function buildMenu(user, data) {
            const menu = document.getElementById('mainMenu');
            const items = [
                { id:'dashboard', icon:'fa-gauge-high', label:'Tableau de bord', module:null },
                { id:'documents', icon:'fa-folder-open', label:'Documents', module:'documents' },
                { id:'inscriptions', icon:'fa-pen-to-square', label:'Inscriptions', module:'inscriptions' },
                { id:'agenda', icon:'fa-calendar-days', label:'Agenda', module:'agenda' },
                { id:'salles', icon:'fa-building', label:'Salles', module:'salles' },
                { id:'absences', icon:'fa-user-slash', label:'Absences', module:'absences' },
                { id:'sondages', icon:'fa-chart-simple', label:'Sondages', module:'sondages' },
                { id:'reunions', icon:'fa-handshake', label:'Réunions', module:'reunions' },
                { id:'alertes', icon:'fa-clock', label:'Alertes', module:'alertes' },
                { id:'notifications', icon:'fa-bell', label:'Notifications', module:'notifications' },
                { id:'recherche', icon:'fa-magnifying-glass', label:'Recherche', module:'recherche' },
                { id:'statistiques', icon:'fa-chart-pie', label:'Statistiques', module:'statistiques' },
                { id:'admin', icon:'fa-gear', label:'Administration', module:null, adminOnly:true },
                { id:'parametres', icon:'fa-sliders', label:'Paramètres', module:'parametres' },
                { id:'droits', icon:'fa-lock', label:'Droits', module:'droits', adminOnly:true }
            ];
            let html = '';
            for (const item of items) {
                if (item.adminOnly && !isAdmin()) continue;
                if (item.module && data.settings.modules[item.module] === false) continue;
                if (item.module && !isAdmin() && !canRead(user, item.module)) continue;
                const active = document.querySelector('.page-section.active')?.id === 'page-'+item.id ? 'active' : '';
                html += `<div class="menu-item ${active}" data-page="${item.id}"><i class="fas ${item.icon}"></i> ${item.label}</div>`;
            }
            menu.innerHTML = html;
            document.querySelectorAll('.menu-item').forEach(el => {
                el.addEventListener('click', function() {
                    const page = this.dataset.page;
                    loadPage(page);
                    localStorage.setItem('ent_last_activity', Date.now());
                    const u = getCurrentUser();
                    if (u) renewSession(u.id);
                });
            });
        }

        function loadPage(pageId) {
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
            const target = document.getElementById('page-'+pageId);
            if (target) {
                target.classList.add('active');
                const menuItem = document.querySelector(`.menu-item[data-page="${pageId}"]`);
                document.getElementById('currentPageTitle').textContent = menuItem ? menuItem.textContent.trim() : pageId;
                document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
                if (menuItem) menuItem.classList.add('active');
                renderPage(pageId);
            }
        }

        function renderPage(page) {
            switch(page) {
                case 'dashboard': renderDashboard(); break;
                case 'documents': renderDocuments(); break;
                case 'inscriptions': renderInscriptions(); break;
                case 'agenda': renderAgenda(); break;
                case 'salles': renderSalles(); break;
                case 'absences': renderAbsences(); break;
                case 'sondages': renderSondages(); break;
                case 'reunions': renderReunions(); break;
                case 'alertes': renderAlertes(); break;
                case 'notifications': renderNotifications(); break;
                case 'recherche': renderRecherche(); break;
                case 'admin': renderAdmin(); break;
                case 'statistiques': renderStatistiques(); break;
                case 'parametres': renderParametres(); break;
                case 'droits': renderDroits(); break;
                default: document.getElementById('page-dashboard').innerHTML = '<p class="text-muted">Page en construction</p>';
            }
        }

        // ================================================================

            const reservations = data.reservations || [];

            const reunionsOpen = reunions.filter(r => r.statut==='ouverte').length;
            const alertesUnread = alertes.filter(a => a.userId===user.id && !a.lu).length;

            let html = `
                <div class="grid-4">
                    <div class="stat-card"><div class="icon blue"><i class="fas fa-calendar-check"></i></div><div class="info"><h3>${resToday}</h3><span>Réservations aujourd'hui</span></div></div>
                    <div class="stat-card"><div class="icon orange"><i class="fas fa-clock"></i></div><div class="info"><h3>${absAtt}</h3><span>Absences en attente</span></div></div>
                    <div class="stat-card"><div class="icon red"><i class="fas fa-bell"></i></div><div class="info"><h3>${notifsUnread}</h3><span>Notifications non lues</span></div></div>

                    <div class="card"><div class="card-header">📅 Calendrier</div><div id="miniCalendar"></div></div>

                                <div class="text-muted" style="font-size:13px;">${a.message}</div>

        function renderMiniCalendar() {
            const c = document.getElementById('miniCalendar');
            if (!c) return;
            const now = new Date();
            const year=now.getFullYear(), month=now.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const days = new Date(year, month+1, 0).getDate();
            let html = '<div class="calendar-grid">';
            const jours = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
            for (let j of jours) html += `<div class="day day-header">${j}</div>`;
            for (let i=0; i<(firstDay===0?6:firstDay-1); i++) html += `<div class="day"></div>`;
            for (let d=1; d<=days; d++) html += `<div class="day day-number">${d}</div>`;
            html += '</div>';
            c.innerHTML = html;
        }

        // --- DOCUMENTS ---
        function renderDocuments() {
            const data = getData();
            const user = getCurrentUser();
            const isAdminUser = isAdmin();
            const docs = data.documents || [];
            const categories = data.categories_documents || [];
            let html = `
                <div class="flex-between mb-20">
                    <div><div class="page-title">Documents administratifs</div><div class="page-subtitle">Consultez et téléchargez</div></div>
                    ${isAdminUser ? `<button class="btn btn-primary" onclick="openModal('documentForm')"><i class="fas fa-plus"></i> Ajouter</button>` : ''}
                </div>
                <div class="search-box">
                    <input type="text" id="docSearch" placeholder="Rechercher..." oninput="filterDocs()">
                    <select id="docCategoryFilter" onchange="filterDocs()">
                        <option value="">Toutes</option>
                        ${categories.map(c => `<option value="${c.id}">${c.nom}</option>`).join('')}
                    </select>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>Nom</th><th>Catégorie</th><th>Date</th><th>Actions</th></tr></thead>
                        <tbody id="docTableBody">
                            ${docs.map(d => {
                                if (!isAdminUser && d.permissions && d.permissions.length && !d.permissions.includes(user.id)) return '';
                                return `<tr data-cat="${d.categorieId}">
                                    <td>${d.nom}</td>
                                    <td>${categories.find(c=>c.id===d.categorieId)?.nom||''}</td>
                                    <td>${new Date(d.date).toLocaleDateString()}</td>
                                    <td>
                                        <button class="btn btn-sm btn-primary" onclick="downloadDoc('${d.id}')"><i class="fas fa-download"></i></button>
                                        ${isAdminUser ? `
                                            <button class="btn btn-sm btn-warning" onclick="editDocument('${d.id}')"><i class="fas fa-edit"></i></button>
                                            <button class="btn btn-sm btn-danger" onclick="deleteDocument('${d.id}')"><i class="fas fa-trash"></i></button>
                                        ` : ''}
                                    </td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            document.getElementById('page-documents').innerHTML = html;
        }
        // Fonctions globales pour documents
        window.filterDocs = function() {
            const s = document.getElementById('docSearch')?.value.toLowerCase()||'';
            const c = document.getElementById('docCategoryFilter')?.value||'';
            document.querySelectorAll('#docTableBody tr').forEach(row => {
                const text = row.textContent.toLowerCase();
                const cat = row.dataset.cat||'';
                let show = true;
                if (s && !text.includes(s)) show = false;
                if (c && cat !== c) show = false;
                row.style.display = show ? '' : 'none';
            });
        };
        window.downloadDoc = function(id) {
            const data = getData();
            const d = data.documents.find(d => d.id === id);
            if (d) { alert(`Téléchargement de "${d.nom}" (simulé)`); addLog('Téléchargement document', d.nom); }
        };
        window.deleteDocument = function(id) {
            if (!confirm('Supprimer ?')) return;
            const data = getData();
            data.documents = data.documents.filter(d => d.id !== id);
            saveData(data);
            addLog('Suppression document', id);
            renderDocuments();
        };

        // Fonctions globales inscriptions
        window.sinscrire = function(id) {
            const data = getData();
            const user = getCurrentUser();
            const evt = data.evenements.find(e => e.id === id);
            if (!evt) return;
            const inscrits = data.inscriptions.filter(i => i.evenementId === id);
            if (evt.nbPlacesMax && inscrits.length >= evt.nbPlacesMax) { alert('Places épuisées.'); return; }
            if (data.inscriptions.some(i => i.evenementId === id && i.userId === user.id)) { alert('Déjà inscrit.'); return; }
            data.inscriptions.push({ id:generateId(), evenementId:id, userId:user.id, userNom:user.prenom+' '+user.nom, date:new Date().toISOString(), statut:'En attente' });

            addLog('Inscription', evt.titre);
            addNotification(user.id, `Inscrit à "${evt.titre}"`, 'success');
            renderInscriptions();

            const user = getCurrentUser();
            data.inscriptions = data.inscriptions.filter(i => !(i.evenementId === id && i.userId === user.id));

        window.setAgendaView = function(view) {
            document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.tabs .tab[data-view="${view}"]`)?.classList.add('active');
            const container = document.getElementById('agendaView');
            const data = getData();
            const events = data.agenda_events || [];
            if (view === 'jour') {
                const today = new Date().toDateString();
                const dayEvents = events.filter(e => new Date(e.date).toDateString() === today);
                container.innerHTML = `<div class="card">
                    <h4>Événements du ${new Date().toLocaleDateString()}</h4>
                    ${dayEvents.length ? dayEvents.map(e => `
                        <div style="border-left:4px solid ${e.couleur||'#4361ee'}; padding:8px 12px; margin:6px 0; background:var(--gray-50); border-radius:8px;">
                            <strong>${e.titre}</strong> - ${e.heure||''} ${e.lieu ? '📍 '+e.lieu : ''}
                            ${isAdmin() ? `<button class="btn btn-sm btn-danger" onclick="deleteAgendaEvent('${e.id}')"><i class="fas fa-trash"></i></button>` : ''}
                        </div>
                    `).join('') : '<p class="text-muted">Aucun événement.</p>'}
                </div>`;
            } else if (view === 'semaine') {
                const today = new Date();
                let html = `<div class="card"><h4>Semaine du ${today.toLocaleDateString()}</h4>`;
                for (let i=0; i<7; i++) {
                    const d = new Date(today); d.setDate(d.getDate()+i);
                    const dayEvents = events.filter(e => new Date(e.date).toDateString() === d.toDateString());
                    html += `<div style="padding:6px 12px; background:var(--gray-50); border-radius:6px; margin:4px 0;">
                        <strong>${d.toLocaleDateString()}</strong> : ${dayEvents.length ? dayEvents.map(e=>e.titre).join(', ') : 'Aucun'}
                    </div>`;
                }
                html += '</div>';
                container.innerHTML = html;
            } else if (view === 'mois') {
                const mois = ['Janv','Févr','Mars','Avr','Mai','Juin','Juil','Août','Sept','Oct','Nov','Déc'];
                const now = new Date();
                const year=now.getFullYear(), month=now.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const days = new Date(year, month+1, 0).getDate();
                let html = `<div class="card"><h4>${mois[month]} ${year}</h4><div class="calendar-grid">`;
                const jours = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
                for (let j of jours) html += `<div class="day day-header">${j}</div>`;
                for (let i=0; i<(firstDay===0?6:firstDay-1); i++) html += `<div class="day"></div>`;
                for (let d=1; d<=days; d++) {
                    const dateObj = new Date(year, month, d);
                    const hasEvent = events.some(e => new Date(e.date).toDateString() === dateObj.toDateString());
                    html += `<div class="day day-number ${hasEvent?'has-event':''}">${d}</div>`;
                }
                html += '</div></div>';
                container.innerHTML = html;
            }
        };

        window.reserverSalle = function(salleId) {
            const data = getData();
            const user = getCurrentUser();
            const date = prompt('Date (JJ/MM/AAAA) :');
            if (!date) return;
            const heure = prompt('Heure (HH:MM) :');

            const salle = data.salles.find(s => s.id === salleId);
            if (salle && salle.disponible === false) { alert('Salle indisponible.'); return; }
            if (data.reservations.some(r => r.salleId===salleId && r.date===date && r.heure===heure && r.statut!=='Refusée')) {
                alert('Conflit détecté.');
                return;

            data.reservations.push({ id:generateId(), salleId, userId:user.id, date, heure, statut:'En attente', dateCreation:new Date().toISOString() });
            saveData(data);
            addLog('Réservation salle', salleId);

            renderSalles();

            if (!r || r.statut==='cloture' || new Date(r.dateLimite) < new Date()) { alert('Réunion clôturée.'); return; }

                const idx = parseInt(val.value);
                r.votes.push({ userId: user.id, creneauIndex: idx });

        window.cloturerReunion = function(id) {
            const data = getData();
            const r = data.reunions.find(r => r.id === id);

        };
        window.finaliserReunion = function(id) {
            const data = getData();
            const r = data.reunions.find(r => r.id === id);
            if (!r || r.creneaux.length===0) { alert('Aucun créneau.'); return; }
            const counts = r.creneaux.map((_, idx) => r.votes.filter(v => v.creneauIndex === idx).length);
            const max = Math.max(...counts);
            const gagneIdx = counts.indexOf(max);
            r.creneauGagne = gagneIdx;
            r.statut = 'cloture';
            const creneau = r.creneaux[gagneIdx];
            data.agenda_events.push({ id:generateId(), titre:'Réunion: '+r.titre, date:creneau.date, heure:creneau.heure, lieu:'Salle à définir', couleur:'#4361ee' });

        window.globalSearch = function() {
            const q = document.getElementById('globalSearch').value.toLowerCase().trim();

            if (!q) { container.innerHTML = '<p class="text-muted">Saisissez un terme.</p>'; return; }
            const data = getData();
            const results = [];
            (data.users || []).forEach(u => { if ((u.nom+u.prenom+u.email).toLowerCase().includes(q)) results.push({type:'Utilisateur', label:u.prenom+' '+u.nom+' ('+u.email+')'}); });
            (data.salles || []).forEach(s => { if ((s.nom+s.batiment+s.equipements).toLowerCase().includes(q)) results.push({type:'Salle', label:s.nom}); });
            (data.documents || []).forEach(d => { if (d.nom.toLowerCase().includes(q)) results.push({type:'Document', label:d.nom}); });
            (data.evenements || []).forEach(e => { if ((e.titre+e.description).toLowerCase().includes(q)) results.push({type:'Événement', label:e.titre}); });
            (data.absences || []).forEach(a => { if ((a.motif+a.commentaire).toLowerCase().includes(q)) { const u = data.users.find(u => u.id===a.userId); results.push({type:'Absence', label:(u?u.prenom+' '+u.nom:'')+' - '+a.motif}); } });
            (data.sondages || []).forEach(s => { if ((s.titre+s.description).toLowerCase().includes(q)) results.push({type:'Sondage', label:s.titre}); });

        window.exporterDonnees = function() {
            const blob = new Blob([JSON.stringify(getData(), null, 2)], {type:'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ent_data_backup.json'; a.click();
            addLog('Export données');
        };
        window.importerFichier = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try { const data = JSON.parse(e.target.result); localStorage.setItem('ent_data', JSON.stringify(data)); alert('Importé. Rechargement...'); location.reload(); }
                catch(err) { alert('Fichier invalide.'); }
            };
            reader.readAsText(file);
        };
        window.reinitialiserPlateforme = function() {
            if (!confirm('Tout supprimer ? Irréversible.')) return;
            localStorage.setItem('ent_data', JSON.stringify(getDefaultData()));
            alert('Réinitialisé.');
            location.reload();
        };

        // --- DROITS ---
        function renderDroits() {
            if (!isAdmin()) { document.getElementById('page-droits').innerHTML = '<p class="text-muted">Accès réservé.</p>'; return; }
            const data = getData();
            const modules = Object.keys(data.settings.modules || {});
            const users = data.users || [];
            let html = `
                <div class="page-title">Gestion des droits avancés</div>
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>Utilisateur</th>${modules.map(m => `<th>${m}</th>`).join('')}</tr></thead>
                        <tbody>
                            ${users.filter(u => u.role !== 'admin').map(u => {
                                const perms = u.permissions || {};
                                return `<tr>
                                    <td><strong>${u.prenom} ${u.nom}</strong></td>
                                    ${modules.map(m => {
                                        const p = perms[m] || { read: false, write: false, delete: false };
                                        return `<td>
                                            <span class="permission-badge ${p.read?'perm-read':'perm-none'}">L</span>
                                            <span class="permission-badge ${p.write?'perm-write':'perm-none'}">E</span>
                                            <span class="permission-badge ${p.delete?'perm-delete':'perm-none'}">S</span>
                                            <button class="btn btn-sm btn-outline" onclick="editDroits('${u.id}','${m}')"><i class="fas fa-edit"></i></button>
                                        </td>`;
                                    }).join('')}
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            document.getElementById('page-droits').innerHTML = html;
        }
        window.editDroits = function(userId, module) {
            const data = getData();
            const user = data.users.find(u => u.id === userId);
            if (!user) return;
            if (!user.permissions) user.permissions = {};
            const p = user.permissions[module] || { read: false, write: false, delete: false };
            const body = document.getElementById('modalBody');
            body.innerHTML = `
                <h2>Droits pour ${user.prenom} ${user.nom} - ${module}</h2>
                <form id="droitsForm">
                    <div><input type="checkbox" id="dRead" ${p.read?'checked':''}> <label for="dRead">Lecture</label></div>
                    <div><input type="checkbox" id="dWrite" ${p.write?'checked':''}> <label for="dWrite">Écriture</label></div>
                    <div><input type="checkbox" id="dDelete" ${p.delete?'checked':''}> <label for="dDelete">Suppression</label></div>
                    <button type="submit" class="btn btn-primary btn-block">Enregistrer</button>
                </form>
            `;
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('droitsForm').addEventListener('submit', function(e) {
                e.preventDefault();
                user.permissions[module] = { read: document.getElementById('dRead').checked, write: document.getElementById('dWrite').checked, delete: document.getElementById('dDelete').checked };

        document.getElementById('emergencyBtn').addEventListener('click', emergencyUnlock);
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.altKey && e.key === 'd') {
                e.preventDefault();
                emergencyUnlock();
            }
        });

        // ================================================================
        //  INIT
        // ================================================================
        initData();
        const session = JSON.parse(localStorage.getItem('ent_session')||'null');
        if (session) {
            const data = getData();
            const user = data.users.find(u => u.id === session.userId);
            if (user && user.active !== false && session.expiry && Date.now() < session.expiry) {
                render();
                addLog('Session reprise', user.email);
                renewSession(user.id);
            } else {
                clearSession();
                document.getElementById('loginPage').classList.add('active');
            }
        } else {
            document.getElementById('loginPage').classList.add('active');
        }

        document.getElementById('notificationBell').addEventListener('click', function() { loadPage('notifications'); });
        document.getElementById('toggleSidebar').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('open');
        });

        console.log('✅ ENT Collège - Version corrigée et stable (toutes les fonctions globales).');
        console.log('📌 Admin: admin@college.fr / Admin123!');
        console.log('🔑 Secours: Ctrl+Alt+D ou bouton en bas à droite');
    </script>
</body>
